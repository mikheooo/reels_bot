services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reels_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d reels_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
  bot:
    image: reels_bot:${RELEASE_GIT_SHA:-dev}
    build:
      context: .
      args:
        VCS_REF: ${RELEASE_GIT_SHA:-dev}
        BUILD_DATE: ${RELEASE_BUILD_DATE:-unknown}
    command: python -m app.bot.main
    env_file: .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
      - EXPECTED_BOT_USERNAME=Reeelsanalyzerbot
    volumes:
      - ./gcp-key.json:/app/gcp-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  worker:
    image: reels_bot:${RELEASE_GIT_SHA:-dev}
    command: arq app.worker.settings.WorkerSettings
    env_file: .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
      - EXPECTED_BOT_USERNAME=Reeelsanalyzerbot
    volumes:
      - ./gcp-key.json:/app/gcp-key.json:ro
      - C:/Users/Misha/.hermes/plans:/plans
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
    name: reels_bot_postgres_data
